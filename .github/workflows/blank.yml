name: Generate Keyword Ideas
on:
  workflow_dispatch:   # Manual trigger
jobs:
  generate-ideas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # (Add pip installs here if you need any libraries)
      - name: Show seed keywords
        run: |
          echo "=== Seed Keywords ==="
          cat seed_keywords.txt
      - name: Run idea generator
        run: |
          python scripts/generate_ideas.py
      - name: Verify output
        run: |
          if [ -f output/ideas.txt ]; then
            echo ":white_tick: Output generated"
            cat output/ideas.txt
          else
            echo ":x: No output file created"
            exit 1
          fi
      - name: Upload output artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyword-ideas
          path: output/ideas.txt
