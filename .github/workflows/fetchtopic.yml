name: Fetch Topics and Upload Artifact
on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  fetch-topics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run Fetchtopics.py
        run: |
          python Fetchtopics.py
      - name: Upload ideas artifact
        uses: actions/upload-artifact@v3
        with:
          name: ideas-json
          path: data/ideas_*.json
