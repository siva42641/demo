name: Fetch Topics and Upload Artifact
on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  fetch-topics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run Fetchtopics.py
        run: |
          python Fetchtopics.py
      - name: Commit and push ideas data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ideas_*.json
          git commit -m "Update ideas data" || echo "No changes to commit"
          git push
